<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>y-webtorrent browser smoke</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 900px; }
      textarea { box-sizing: border-box; width: 100%; height: 14rem; font: inherit; }
      pre { background: #f5f5f5; padding: 1rem; overflow: auto; }
      label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; font: inherit; padding: 0.35rem; }
      button { margin-top: 0.75rem; }
    </style>
  </head>
  <body>
    <h1>y-webtorrent browser smoke</h1>

    <label for="room">Room</label>
    <input id="room" />

    <label for="trackers">Trackers, comma separated</label>
    <input id="trackers" />

    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>

    <h2>Shared text</h2>
    <textarea id="text" disabled placeholder="Connect in two tabs, then type here..."></textarea>

    <h2>Status</h2>
    <pre id="status"></pre>

    <script>window.global = window.globalThis</script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
